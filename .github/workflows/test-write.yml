name: Test écriture
on: workflow_dispatch

permissions:
  contents: write

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Écrire le fichier
        run: |
          echo "{\"ok\": true, \"written\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > test.json
      - name: Commit
        run: |
          git config user.name "rss-bot"
          git config user.email "rss-bot@users.noreply.github.com"
          git add test.json
          git diff --staged --quiet || git commit -m "Test écriture"
          git push
