name: Collecte RSS
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install rss-parser
      - run: node scripts/collect.js
      - name: Commit
        run: |
          git config user.name "rss-bot"
          git config user.email "rss-bot@users.noreply.github.com"
          git add *.json
          git diff --staged --quiet || git commit -m "Maj flux $(date -u +%Y-%m-%dT%H:%M)"
          git push
